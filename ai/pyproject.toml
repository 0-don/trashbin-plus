[project]
name = "trashbin-ai"
version = "0.1.0"
description = "Harvest per-generator AI music clips, train and evaluate the preview detector"
requires-python = ">=3.14"
dependencies = [
    "huggingface_hub>=2.0.0",
    "numpy>=2.5.3",
    "onnx>=1.23.0",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "remotezip>=0.12.6",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
